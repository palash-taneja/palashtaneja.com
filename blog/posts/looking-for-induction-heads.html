Two weekends staring at attention heatmaps. Working through [ARENA chapter 1.2](https://arena-chapter1-transformer-interp.streamlit.app/), which is item one on Neel Nanda's [how-to-become-a-mech-interp-researcher](https://www.alignmentforum.org/posts/jP9KDyMkchuv6tHwm/how-to-become-a-mechanistic-interpretability-researcher) and the first thing in that pipeline that feels like real work as opposed to reading.

The model is a 2-layer attention-only transformer somebody trained for the exercises. No MLPs, no layer norm, no biases. 12 heads per layer. You load it in [TransformerLens](https://github.com/neelnanda-io/TransformerLens), which wraps every intermediate activation in a named hook so you can read or overwrite anything mid-forward-pass.

The first thing you do is just look. Run the model on a paragraph and stare at the 24 heatmaps until your eyes start picking the patterns out. Most heads are doing something boring and visible:

- attending to themselves (diagonal stripe)
- attending to the previous token (one-below-diagonal stripe)
- dumping their attention on the BOS token because they don't know what else to do (vertical stripe at column 0)

A one-line detector for each. Mine for previous-token:

\`\`\`python
def prev_attn_detector(cache):
    ret = []
    for layer in range(model.cfg.n_layers):
        layer_pattern = cache["pattern", layer]
        for head_idx in range(layer_pattern.shape[0]):
            head = layer_pattern[head_idx]
            diag_sum = sum(head[i][i - 1] for i in range(1, head.shape[0]))
            if diag_sum >= 0.3 * head.sum():
                ret.append(f"{layer}.{head_idx}")
    return ret
\`\`\`

(The \`head.sum()\` denominator is weird. The published solution just does \`.diagonal(-1).mean()\` against a fixed threshold. Both work. Mine is what came out the first time and I didn't bother fixing it.)

None of these three patterns is interesting on its own. You could get them with bigrams. The interesting thing happens when two of them learn to talk to each other.

## Induction heads

The rule an induction head implements: if the current token is A, and somewhere earlier in the context the bigram A B appeared, predict B. That is in-context learning at its most stripped down. The model has never seen this particular A-followed-by-B pair in training. It just notices A B happened earlier in *this* context and bets on a repeat.

You can't do this in one layer. A single attention head computes its pattern from the query token and the key token only. It cannot attend to a position based on the token *before* it. So the circuit has to split across two layers:

1. A previous-token head in layer 0 copies information about token A into the residual stream at the position of token B. Now position B "knows" it follows A.
2. An induction head in layer 1, querying from a later A, matches against keys that say "I follow A," attends to the corresponding B, and copies B into its output.

Two heads, K-composition (layer 1's keys depend on layer 0's outputs). The simplest case of "head behavior only legible in terms of another head's behavior," and apparently this idea is everywhere once you start looking for it.

## How you confirm

Feed the model \`[BOS, r_1, r_2, ..., r_n, r_1, r_2, ..., r_n]\`. Random tokens, repeated twice. First half is noise. Second half is the same noise. A model with no induction circuit is equally lost on both halves. A model with one tanks on the first half and then drops off a cliff at position n+1, because the circuit can copy each token over from the first occurrence.

Per-token loss when I plotted it: noise, noise, noise, cliff. Felt good.

The corresponding attention pattern has a beautiful signature: a diagonal stripe offset by exactly seq_len-1, which is the distance from second-A back to the position right after first-A. Detector:

\`\`\`python
def induction_attn_detector(cache):
    attn_heads = []
    for layer in range(model.cfg.n_layers):
        for head in range(model.cfg.n_heads):
            attention_pattern = cache["pattern", layer][head]
            seq_len = (attention_pattern.shape[-1] - 1) // 2
            score = attention_pattern.diagonal(-seq_len + 1).mean()
            if score > 0.4:
                attn_heads.append(f"{layer}.{head}")
    return attn_heads
\`\`\`

Picks out 1.4 and 1.10 cleanly. 1.6 is borderline. The other nine heads in layer 1 are doing something else.

## Why I keep doing this

Induction heads get more attention than the other patterns because they appear to be where in-context learning *comes from*. Anthropic's paper on this shows the heads forming during training in a sharp phase change, and that change coincides with a visible bump down in the loss curve and the model suddenly being able to do meta-learning-style tasks from prompts.

That is the alignment-relevant part. A capability that shows up in a phase transition is one you can't extrapolate toward from earlier checkpoints. There is no smooth "the model is becoming half as good at in-context learning" warning sign. One day the heads aren't there. Next day they are. If the next phase change is something less benign, situational awareness or deception, the induction-heads story suggests you don't get a warning shot.

The other thing I noticed, doing this hands-on: most of the work is just looking. The detectors are five-line functions. The hard part is staring at heatmaps long enough to notice there are three patterns and not one. Closer to microscopy than to ML.

Hooks next, then reverse-engineering an induction circuit straight from the weights. I want to read the algorithm off the matrices, not just confirm it from outside.
