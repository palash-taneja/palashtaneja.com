I have been working through the mechanistic-interpretability exercises in [ARENA](https://arena-chapter1-transformer-interp.streamlit.app/), following the path in Neel Nanda's guide on [how to become a mechanistic interpretability researcher](https://www.alignmentforum.org/posts/jP9KDyMkchuv6tHwm/how-to-become-a-mechanistic-interpretability-researcher). One of the first substantial exercises is to find induction heads in a small transformer.

I had read about induction heads before starting the exercise. I understood the basic claim that they help a model continue patterns from its context. What I did not understand as clearly was how this behavior could be split across multiple attention heads, or how you could identify the circuit from activations rather than simply trusting the description in a paper.

So I spent two weekends looking at attention patterns, writing small detectors, and testing a two-layer model on repeated random sequences.

TL;DR: I found two clear induction heads in a two-layer attention-only transformer. A previous-token head in the first layer writes information that later induction heads use to match repeated token sequences. The experiment was also a useful introduction to how mechanistic interpretability works in practice: observe a pattern, turn it into a quantitative test, and then check whether the proposed components form a coherent circuit.

## The model

The model used in the exercise is a small attention-only transformer with two layers and 12 heads per layer. It has no MLPs, layer normalization, or attention biases. This makes it much easier to reason about than a production language model because almost all of the computation happens inside 24 attention heads.

I loaded the model using [TransformerLens](https://github.com/TransformerLensOrg/TransformerLens). TransformerLens provides named hooks for intermediate activations, which means I can run a forward pass and retrieve the attention pattern, queries, keys, values, or residual-stream contribution for any head.

The first step was simply to run the model on normal text and look at the attention heatmaps. Several common patterns appeared repeatedly:

- heads that attend to the current token, producing a diagonal stripe
- heads that attend to the previous token, producing a stripe just below the diagonal
- heads that place most of their attention on the beginning-of-sequence token

These patterns are easy to recognize visually, but I also wanted a numerical test. My first detector for previous-token heads measured how much of a head's total attention fell on the diagonal immediately below the main one:

\`\`\`python
def prev_attn_detector(cache):
    detected_heads = []

    for layer in range(model.cfg.n_layers):
        layer_pattern = cache["pattern", layer]

        for head_idx in range(layer_pattern.shape[0]):
            head = layer_pattern[head_idx]
            diagonal_sum = sum(
                head[position][position - 1]
                for position in range(1, head.shape[0])
            )

            if diagonal_sum >= 0.3 * head.sum():
                detected_heads.append(f"{layer}.{head_idx}")

    return detected_heads
\`\`\`

This implementation is slightly unusual because it divides by all attention in the matrix. A cleaner version would take the mean of \`head.diagonal(-1)\` and compare it with a fixed threshold. Both identify the same qualitative behavior, but writing my own detector forced me to define what I meant by a previous-token head rather than relying only on a heatmap.

## What an induction head does

An induction head implements a simple pattern-completion rule. Suppose the sequence contains the tokens A followed by B. If A appears again later, the model should predict that B will follow it again.

In schematic form:

> ... A B ... A -> predict B

The important part is that A and B can be arbitrary tokens. The model does not need to have memorized that specific pair during training. It notices a relationship inside the current context and reuses it, which makes induction one of the simplest examples of in-context learning.

This operation is difficult to implement with a single attention head. At the later occurrence of A, the model needs to find a previous position whose preceding token was also A, then copy the token that came after it. A normal attention pattern compares information available at the current query position with information available at candidate key positions. The key at B therefore needs to contain information saying that B was preceded by A.

In this model, the computation is split across two layers:

1. A previous-token head in layer 0 copies information about A forward into the residual stream at the position of B.
2. An induction head in layer 1 sees the later A and attends to positions whose residual representation says, in effect, "I followed A."
3. The induction head then copies information about B into the current residual stream, increasing the probability that the model predicts B.

The second head's keys depend on information written by the first head. This interaction is usually described as K-composition. The behavior of the induction head only makes sense when considered together with the previous-token head that prepares its keys.

This was the part that became much clearer through the exercise. Individual heads are not always self-contained features. One head can write an intermediate representation whose only purpose is to make another head's attention pattern possible.

## Testing the circuit

To test for induction, I constructed a sequence of random tokens and repeated it:

\`[BOS, r_1, r_2, ..., r_n, r_1, r_2, ..., r_n]\`

The first half is intentionally unpredictable. The tokens are random, so the model should have high loss. In the second half, however, every local pattern has appeared once already. If the model has an induction circuit, it can use the first copy to predict the second.

The per-token loss matched this prediction. It remained high through the first random sequence and then dropped sharply when the repeated section began. That behavioral result showed that the model was taking advantage of repetition, but it did not yet identify which heads were responsible.

An induction head should also produce a specific attention pattern on this input. At each position in the second copy, it should attend to the position immediately after the matching token in the first copy. On a heatmap, this appears as a diagonal offset by the length of the repeated sequence.

I measured the mean attention on that diagonal:

\`\`\`python
def induction_attn_detector(cache):
    detected_heads = []

    for layer in range(model.cfg.n_layers):
        for head in range(model.cfg.n_heads):
            attention_pattern = cache["pattern", layer][head]
            seq_len = (attention_pattern.shape[-1] - 1) // 2
            score = attention_pattern.diagonal(-seq_len + 1).mean()

            if score > 0.4:
                detected_heads.append(f"{layer}.{head}")

    return detected_heads
\`\`\`

This detector identified heads 1.4 and 1.10 clearly, with head 1.6 showing a weaker version of the same pattern. The fact that the clearest heads appear in the second layer is consistent with the proposed circuit: they need the previous-token information written during the first layer.

## From a pattern to a mechanism

Finding an offset diagonal in an attention matrix is useful evidence, but attention alone does not prove that a head causes the model's improved predictions. A head can attend to the expected tokens while writing irrelevant information through its value and output matrices.

A stronger analysis would connect several pieces of evidence:

- the model's loss improves when the repeated sequence begins
- particular heads attend along the induction diagonal
- earlier previous-token heads write the information those heads use
- ablating the candidate heads removes some of the behavioral improvement
- the candidate heads' value and output matrices write the expected next-token information

The exercise begins with the first two pieces and motivates the rest. My next step is to use TransformerLens hooks to ablate the candidate heads and inspect the QK and OV circuits directly. I want to move from saying that a head has an induction-shaped attention pattern to explaining how its weight matrices implement the algorithm.

## Why induction heads are interesting

Induction heads matter because they provide a relatively concrete example of a learned circuit supporting in-context behavior. Work on induction heads has found that they can emerge abruptly during training and that their appearance coincides with a noticeable improvement in in-context learning and validation loss.

I think this is relevant to how we reason about capability development in larger models. Some useful behaviors may depend on several components becoming coordinated, so progress in the final behavior does not always need to look smooth from the outside. Induction heads are a small and unusually tractable example of that possibility.

I would not generalize directly from a two-layer attention-only transformer to complex capabilities such as situational awareness or deception. The useful lesson is narrower: a capability can become much more visible once a particular circuit forms, and studying the components can reveal changes that aggregate loss alone does not explain.

The other thing I learned is that a large part of this work is careful observation. The detector functions are short. The difficult part is deciding which visual pattern matters, defining a metric that captures it, and checking that the proposed explanation survives interventions.

The immediate result is that I found two strong induction heads and understood the two-layer circuit they participate in. The longer-term goal is to read that circuit directly from the model's weights and then look for similar structures in [the GPT-2 model I trained myself](training-gpt-2-from-scratch.html).
