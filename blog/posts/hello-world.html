<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World - Palash Taneja</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Fragment+Mono:ital@0;1&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      background: #F0EEE6;
      color: #191919;
      font-family: 'Fraunces', Georgia, serif;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }

    .header {
      margin-bottom: 3rem;
    }

    /* Small cream block, matching the homepage buttons */
    .back-link {
      display: inline-block;
      font-family: 'Fragment Mono', monospace;
      color: #3D3929;
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      padding: 0.55rem 1.2rem;
      background: #F1EAD7;
      border: 1.5px solid #3D3929;
      border-radius: 10px;
      box-shadow:
        0 4px 0 0 #CFC7B0,
        0 4px 0 1.5px #3D3929;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .back-link:hover {
      transform: translateY(-2px);
      box-shadow:
        0 6px 0 0 #CFC7B0,
        0 6px 0 1.5px #3D3929;
    }

    .back-link:active {
      transform: translateY(3px);
      box-shadow:
        0 1px 0 0 #CFC7B0,
        0 1px 0 1.5px #3D3929;
    }

    .post-date {
      font-family: 'Fragment Mono', monospace;
      font-size: 0.65rem;
      color: #A39E8F;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .post-title {
      font-size: 2.3rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .post-content {
      margin-top: 3rem;
      line-height: 1.8;
      font-size: 0.98rem;
      font-weight: 340;
      color: #3D3929;
    }

    .post-content h2 {
      font-size: 1.45rem;
      font-weight: 500;
      color: #191919;
      margin: 2.5rem 0 1rem;
    }

    .post-content h3 {
      font-size: 1.15rem;
      font-weight: 500;
      color: #191919;
      margin: 2rem 0 0.75rem;
    }

    .post-content p {
      margin-bottom: 1.25rem;
    }

    .post-content a {
      color: #6F7D52;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }

    .post-content a:hover {
      color: #5A6642;
    }

    .post-content ul,
    .post-content ol {
      margin: 1rem 0 1.5rem 1.5rem;
    }

    .post-content li {
      margin-bottom: 0.5rem;
    }

    .post-content code {
      font-family: 'Fragment Mono', monospace;
      background: #F1EAD7;
      color: #3D3929;
      padding: 0.1rem 0.4rem;
      font-size: 0.8em;
      border: 1px solid rgba(61, 57, 41, 0.35);
      border-radius: 6px;
    }

    .post-content pre {
      font-family: 'Fragment Mono', monospace;
      background: #262420;
      color: #EDEAE0;
      border: 1.5px solid #3D3929;
      border-radius: 12px;
      padding: 1.4rem;
      overflow-x: auto;
      margin: 1.5rem 0;
      font-size: 0.78rem;
      line-height: 1.65;
    }

    .post-content pre code {
      background: none;
      color: inherit;
      padding: 0;
      border: none;
      border-radius: 0;
    }

    .post-content blockquote {
      border-left: 2px solid #6F7D52;
      padding-left: 1.25rem;
      margin: 1.5rem 0;
      color: #6B675C;
      font-style: italic;
    }

    .post-content img {
      max-width: 100%;
      border: 1.5px solid #3D3929;
      border-radius: 12px;
      margin: 1.5rem 0;
    }

    .post-content hr {
      border: none;
      border-top: 1px solid #DDD8C9;
      margin: 2.5rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="../index.html" class="back-link">&larr; Back to Blog</a>
      <div class="post-date">January 15, 2024</div>
      <h1 class="post-title">Hello World</h1>
    </header>

    <article class="post-content" id="content">
      <!-- Markdown content will be rendered here -->
    </article>
  </div>

  <!-- Marked.js for markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // Write your blog post in markdown here
    const markdown = `
Welcome to my blog! I'm Palash, a software engineer based in Brooklyn, NY.

## What to Expect

This is where I'll be sharing my thoughts on:

- **Software Engineering** - deep dives into interesting technical problems
- **Side Projects** - documenting what I'm building and learning
- **Brooklyn Life** - occasional musings on city living

## Why a Blog?

I've always found that writing helps me think more clearly. There's something about putting ideas into words that forces you to really understand them.

> "The act of writing is the act of discovering what you believe." — David Hare

## The Stack

This site is intentionally minimal. Just HTML, CSS, and vanilla JavaScript. The dithered Rubik's cube on the homepage is rendered entirely in canvas using an 8×8 Bayer matrix for that retro aesthetic.

\`\`\`javascript
// The dithering magic
const bayerMatrix = [
  [ 0, 32,  8, 40,  2, 34, 10, 42],
  [48, 16, 56, 24, 50, 18, 58, 26],
  // ...
];
\`\`\`

## Stay Tuned

More posts coming soon. Thanks for reading!
`;

    document.getElementById('content').innerHTML = marked.parse(markdown);
  </script>
</body>
</html>
