Spent the weekend renting GPUs and writing GPT-2 from scratch. Item three on Neel Nanda's [become-a-mech-interp-researcher](https://www.alignmentforum.org/posts/jP9KDyMkchuv6tHwm/how-to-become-a-mechanistic-interpretability-researcher) is "implement a transformer from scratch and train it on something," and apparently I do not get to skip steps.

The model is GPT-2 small. 125M params, 12 layers, 12 heads, d_model=768, n_ctx=1024. The whole thing is one ~400-line file with each component as its own \`nn.Module\`, deliberately not fused, so the code maps one-to-one with the boxes in [A Mathematical Framework for Transformer Circuits](https://transformer-circuits.pub/2021/framework/index.html). I wrote it that way because the entire point of building the thing is to reach inside it later.

Single-head attention forward, written long-form so I can't fool myself:

\`\`\`python
def forward(self, x):
    q = self.W_Q(x)
    k = self.W_K(x)
    v = self.W_V(x)

    scores = q @ k.transpose(-1, -2) / math.sqrt(self.cfg.d_head)

    seq_len = x.size(1)
    mask = torch.tril(torch.ones(seq_len, seq_len, dtype=torch.bool, device=x.device))
    scores = scores.masked_fill(~mask, float('-inf'))

    A = F.softmax(scores, dim=-1)
    result = A @ v
    return self.W_O(result)
\`\`\`

For training I swapped this out for a fused multi-head version that calls PyTorch's \`scaled_dot_product_attention\` (which dispatches to FlashAttention). The single-head class stays around for sanity, and the multi-head exposes per-head W_Q / W_K / W_V / W_O slices as views into the fused weight tensor, so when I want to do circuit analysis later I can pretend the heads were never fused. That bridge took longer to write than the actual attention.

## When the residual stream stops being a metaphor

The transformer block in full:

\`\`\`python
def forward(self, x):
    x = x + self.attn(self.ln1(x))
    x = x + self.mlp(self.ln2(x))
    return x
\`\`\`

x is the *residual stream*, and every component reads from it and writes back to it. Heads do not "transform" x. They produce a delta. Which means when the circuits paper says "head 0.7 copies previous-token information into the residual stream so head 1.4 can read it," that is a description of literal addition into a literal tensor, not a metaphor.

(I had read this sentence many times before this week and it had bounced off. Implementing the +x is what made it stop bouncing.)

## Training, with gotchas

The pod is one GPU on RunPod. The setup script is twenty lines: pip install, wandb login, nohup the training, walk away. Resume-from-latest is \`ls -t ckpt_*.pt | head -1\`. Hard to mess up.

Dataset is [TinyStories](https://huggingface.co/datasets/roneneldan/TinyStories), streamed from HuggingFace. (My class is named \`FineWebDataset\` because I wrote it for FineWeb-Edu first and never renamed it. Future-Palash problem.) TinyStories is the right call for a learning project: small vocab, simple syntax, you see coherent text inside a few thousand steps instead of waiting a week.

Other choices, mostly standard:

- mixed precision (fp16 autocast + GradScaler), ~2x throughput, no instability
- \`torch.compile\` on the whole model, pays off in a few hundred steps
- cosine LR with linear warmup
- gradient accumulation: batch=12, accum=11, seq=1024, ≈135k tokens per optimizer step
- AdamW with betas (0.9, 0.95), weight_decay 0.1
- wandb wired in from the start

Throughput lands around 105k tokens/sec. A 20k-step run is ~5-6 hours wall time.

## Two bugs in my logging that made me think the model was broken

Watched the printed loss bounce between 11 and 14 for a while and got increasingly worried. ln(50257) is 10.83. A loss of 12 is *worse than random*. How is this generating coherent text?

It is not 12. I am summing per-micro-batch loss into \`accum_loss\` and only resetting it every \`log_every\` steps. So \`accum_loss\` is the real loss summed across about a hundred micro-batches. Real per-token loss is closer to 1.2. Logging bug. Model is fine.

While we are at it, the printed grad norm is always 0.00. That is because I compute it *after* \`optimizer.zero_grad()\`. No gradients to norm. Same situation: numbers nonsense, model fine. I will fix both eventually.

## What it sounds like at step 6000

Prompt: "The meaning of life is"

> The meaning of life is not always available to help others. Once upon a time, there was a little girl named Lily. She liked to play with her toys and read books. One day, her mommy asked her to help clean up her room. Lily was happy to help. She picked up her toys and put them away.

The model has obviously memorized the genre conventions of TinyStories and falls into them no matter what you prompt with. But syntax is clean, names persist across sentences, pronouns resolve. Small model, narrow data, but the basic ingredients of language modeling are there.

The "def fibonacci(n):" prompt produces a confused TinyStory about a boy mixing salt with a spoon, which is delightful and exactly what you'd expect from a model whose entire universe is preschool fiction.

## Now what

The whole point of building this from scratch was to have a model where I can do the circuit analysis from [the previous post](looking-for-induction-heads.html) on weights I trained myself. Helpers are already wired up:

\`\`\`python
def compute_ov_circuit(model, layer_idx, head_idx):
    head = model.blocks[layer_idx].attn.heads[head_idx]
    return model.W_U.weight @ head.W_O.weight @ head.W_V.weight @ model.W_E.weight.T
\`\`\`

Once training finishes I want to ask: which heads ended up doing previous-token attention, which look like induction heads, do any of them have a copying eigenvalue signature in their OV circuit. (Apparently random matrices give roughly 50% positive-real eigenvalues. Copying matrices are 80%+.)

In the meantime I should probably go fix the logging.
