    const markdown = `
I have been trying to learn more about mechanistic interpretability, and one piece of advice that comes up repeatedly is to implement a transformer yourself. It is also one of the exercises in Neel Nanda's guide on [how to become a mechanistic interpretability researcher](https://www.alignmentforum.org/posts/jP9KDyMkchuv6tHwm/how-to-become-a-mechanistic-interpretability-researcher).

I had already read through transformer implementations and understood the architecture at a high level. However, there is a difference between recognizing the equations and having to make every tensor shape, residual connection, mask, and optimizer step work yourself. So I spent a weekend implementing GPT-2, renting a GPU on RunPod, and training the model on TinyStories.

TL;DR: I implemented a roughly 125M-parameter GPT-2 model from scratch and trained it on TinyStories. The model learned coherent syntax and short-story structure within a few thousand steps. More importantly, implementing the architecture made ideas like the residual stream and per-head circuits much more concrete, and left me with a model whose internals I can inspect in later experiments.

## Building the model

I used the GPT-2 Small architecture: 12 layers, 12 attention heads, a model dimension of 768, and a context length of 1,024 tokens. The implementation is around 400 lines, with the major components represented as separate PyTorch modules.

I deliberately started with an explicit implementation rather than immediately optimizing everything. The point was to make the code correspond as closely as possible to the objects described in papers such as [A Mathematical Framework for Transformer Circuits](https://transformer-circuits.pub/2021/framework/index.html). If I later want to inspect a particular head or calculate a circuit, I want to know exactly where its weights and activations are.

For example, the basic single-head attention operation looks like this:

\`\`\`python
def forward(self, x):
    q = self.W_Q(x)
    k = self.W_K(x)
    v = self.W_V(x)

    scores = q @ k.transpose(-1, -2) / math.sqrt(self.cfg.d_head)

    seq_len = x.size(1)
    mask = torch.tril(
        torch.ones(seq_len, seq_len, dtype=torch.bool, device=x.device)
    )
    scores = scores.masked_fill(~mask, float('-inf'))

    attention = F.softmax(scores, dim=-1)
    result = attention @ v
    return self.W_O(result)
\`\`\`

The input is projected into queries, keys, and values. The query-key product determines which previous positions each token can attend to, the causal mask prevents the model from looking into the future, and the resulting attention probabilities select a weighted combination of the values.

Writing this explicitly was useful for understanding the operation, but it was not the version I used for the full training run. For training, I added a fused multi-head implementation using PyTorch's \`scaled_dot_product_attention\`, which can dispatch to faster attention kernels on the GPU.

I still wanted the optimized implementation to remain interpretable. The fused module therefore exposes the individual W_Q, W_K, W_V, and W_O matrices for each head as views into the combined parameter tensors. This lets training use the faster implementation while later analysis can still treat each head as a separate object.

## Understanding the residual stream

The full transformer block is surprisingly small:

\`\`\`python
def forward(self, x):
    x = x + self.attn(self.ln1(x))
    x = x + self.mlp(self.ln2(x))
    return x
\`\`\`

Here, \`x\` is the residual stream. Each attention or MLP component reads from that shared representation, calculates an update, and adds the update back into it.

I had read descriptions of the residual stream many times before implementing this model. It was easy to treat it as an abstraction for how information moves through a transformer. Writing the block made it much more literal. When an interpretability paper says that one head writes information that a later head reads, it is describing one component adding a vector into this tensor and another component later projecting information out of the same tensor.

That was probably the most useful conceptual result of implementing the model. The transformer stopped looking like a sequence of opaque layers and started looking more like a collection of components communicating through a shared workspace.

## Training on TinyStories

I trained the model on [TinyStories](https://huggingface.co/datasets/roneneldan/TinyStories), streamed from Hugging Face. TinyStories consists of short stories written with simple vocabulary and syntax. This made it a good dataset for the experiment because a relatively small model can begin producing recognizable text after only a few thousand steps.

I originally wrote the dataset loader for FineWeb-Edu, which is why the class in my code is still called \`FineWebDataset\`. I switched to TinyStories because the goal of this run was to verify the implementation and produce a useful model for interpretability work, rather than to spend a large amount of compute training a broadly capable language model.

The rest of the training setup was fairly standard:

- FP16 autocast with gradient scaling
- \`torch.compile\` applied to the full model
- AdamW with betas of 0.9 and 0.95 and weight decay of 0.1
- a cosine learning-rate schedule with linear warmup
- a micro-batch size of 12 with 11 gradient-accumulation steps
- sequences of 1,024 tokens, for roughly 135,000 tokens per optimizer step
- Weights & Biases logging and regular checkpoints

On the rented GPU, training reached around 105,000 tokens per second. The RunPod setup itself was simple: install the dependencies, authenticate Weights & Biases, start the process under \`nohup\`, and save checkpoints often enough that an interrupted instance would not lose much progress.

## The logging bugs

The model began generating reasonable text, but my terminal was reporting losses between 11 and 14. That did not make sense. With a vocabulary of 50,257 tokens, the cross-entropy loss for a uniform random prediction is about \`ln(50257) = 10.83\`. A loss above that would mean the model was performing worse than random, which was inconsistent with the samples I was seeing.

The model was not the problem. My logging code was accumulating the loss from many micro-batches and printing the sum instead of the average. The reported number therefore was not the model's actual per-token loss. Once I normalized it correctly, the value was much closer to what the generated samples suggested.

I found a second logging problem with the gradient norm. It was always printed as 0.00 because I calculated it after calling \`optimizer.zero_grad()\`. By the time the logging code ran, the gradients had already been cleared.

Neither bug affected training, but both made it harder to understand whether training was healthy. This was a useful reminder that observability code is part of the experiment. A model can be working correctly while a bad metric convinces you that it is broken.

## What the model learned

By step 6,000, the model was already producing text with clean local syntax and a recognizable TinyStories structure. For the prompt "The meaning of life is", it generated:

> The meaning of life is not always available to help others. Once upon a time, there was a little girl named Lily. She liked to play with her toys and read books. One day, her mommy asked her to help clean up her room. Lily was happy to help. She picked up her toys and put them away.

This is not a good answer to the prompt, but it shows what the model learned. It can maintain names across sentences, use pronouns consistently, and produce a sequence of events with the style of the training data.

It also shows the limits of the dataset. Almost every prompt eventually turns into a children's story because that is the model's entire world. Prompting it with \`def fibonacci(n):\` produced a confused story about a boy mixing salt with a spoon. The model had learned the distribution it was trained on, not a general ability to complete arbitrary text.

## What I want to inspect next

The main reason I built the model was to run mechanistic-interpretability experiments on weights that I trained and fully understand. In [my previous post](looking-for-induction-heads.html), I looked at induction heads. I now want to repeat that kind of analysis on this model and follow how those structures emerge during training.

For example, I added a helper for calculating a head's OV circuit:

\`\`\`python
def compute_ov_circuit(model, layer_idx, head_idx):
    head = model.blocks[layer_idx].attn.heads[head_idx]
    return (
        model.W_U.weight
        @ head.W_O.weight
        @ head.W_V.weight
        @ model.W_E.weight.T
    )
\`\`\`

The OV circuit describes how information read by a head is transformed into logits over output tokens. A head that copies tokens should have a different structure from a random matrix, including a larger fraction of positive real eigenvalues. I want to test which heads attend to previous tokens, which display induction patterns, and whether the heads that look like copying heads in their attention patterns also have the expected OV structure.

The immediate result is not that I trained a useful general-purpose language model. It is that I now have a small transformer whose architecture, training process, and weights I can trace end to end. Implementing it made several interpretability concepts more concrete, and the trained checkpoints give me a controlled system for testing those concepts rather than only reading about them.
