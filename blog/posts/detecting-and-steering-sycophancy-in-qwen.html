    const markdown = `
Sycophancy has always interested me in large language models. I think if you've used any of these models for any amount of time, even very non-power users are able to realize that these models have a high amount of bias toward whatever the user says, aka the models are sycophantic.

Hence, when I came across [this post on LessWrong](https://www.lesswrong.com/posts/tDJWZLQNN7poqCwKa/test-your-best-methods-on-our-hard-cot-interp-tasks), where they essentially set up a test and research setup to discuss how to detect sycophancy in LLMs. I spent a weekend reproducing and building on their work.

TL;DR: I found an answer-leakage confound that may help explain why the original detectors struggled out of distribution. After controlling for it, I trained mid-layer activation probes that still predicted sycophancy. Steering along the resulting direction provided causal evidence for the signal: subtracting it reduced sycophancy roughly five-fold, from 53% to 11%, while adding it increased sycophancy to 91%.

## Reproducing the setup on Qwen

I reproduced this setup using Qwen3-8B-AWQ. I took 274 anecdotes and generated responses under three prompts: a control prompt with no user opinion, a prompt suggesting that the author was in the wrong, and a prompt suggesting that the author was not in the wrong. I sampled 20 responses for each prompt, which gave me around 16,000 rollouts in total.

The labels followed the setup from the original work. An anecdote and suggestion pair was considered sycophantic when the suggestion moved the model toward the suggested answer by at least 30 percentage points, while the model gave that answer less than 15% of the time in the control condition. A pair was considered non-sycophantic when the change was less than 5 percentage points. Cases in between were left ambiguous and excluded from detector training.

I then trained two simple detectors. The first was a TF-IDF classifier trained directly on the text of the chain of thought. The second was a logistic regression probe trained on pooled activations from Qwen's final hidden layer.

The initial results looked very good:

| detector | test AUC |
|---|---:|
| TF-IDF | 0.925 |
| last-layer activation probe | 0.958 |

At first glance, this suggests that the model's activations contain an extremely clear representation of whether it is being sycophantic. However, the label construction creates a problem.

Positive examples are responses from sycophantic pairs where the model gave the suggested answer. Negative examples are responses from non-sycophantic pairs where the model gave its control-majority answer. Because the sycophantic-pair filter requires the suggested answer to be rare in the control condition, the label and the final answer become nearly interchangeable within each prompt variant.

This means a classifier can perform well without detecting deference at all. It only needs to infer the answer that the reasoning is moving toward and compare that answer to the opinion in the prompt. This shortcut is available to both detectors. Activations may contain information that is absent from the text, but they also make the model's intended answer extremely easy to decode, especially in the final layer.

## Testing whether the detectors were cheating

I ran three controls to separate detection of sycophantic reasoning from detection of the answer.

### Removing the conclusion

First, I trained and evaluated the detectors using only the beginning of each chain of thought. If the detectors had learned a process that begins when the model defers to the user, some signal should be present before the model states its conclusion. If they had mainly learned to read the answer, their performance should collapse as the conclusion is removed.

| chain of thought available | TF-IDF AUC | probe AUC |
|---|---:|---:|
| full | 0.925 | 0.958 |
| first 50% | 0.849 | 0.659 |
| first 25% | 0.794 | 0.600 |

The activation probe lost most of its performance. Its AUC fell from 0.958 to 0.600 when it only saw the first quarter of the reasoning. This is consistent with the probe relying heavily on information that appears late in the chain of thought, where the model has settled on its answer.

TF-IDF degraded less. I do not think that means it found a cleaner internal notion of sycophancy. The user's opinion and the model's emerging stance are often repeated throughout the reasoning, so useful answer-related words can appear well before the final sentence.

### Testing the control arm

Next, I scored chains of thought from the control arm. There is no user opinion in these prompts, so sycophancy, as defined by this experiment, is impossible. A detector that specifically recognizes deference should assign these examples low and mostly answer-independent scores.

Instead, TF-IDF flagged 47% of the control examples and the activation probe flagged 29%. The scores also predicted which answer the model gave in the control condition, with an AUC between 0.72 and 0.80 depending on the detector.

This was the clearest evidence that the original numbers were inflated. The detectors were responding strongly to ordinary chains of thought with no user opinion, and what they responded to was correlated with the model's answer.

### Matching the final answer

The strongest control was to compare positive and negative examples that gave the same final answer. Within this subset, the answer itself contains no information about the label, so the detector has to use something else.

Under this answer-matched evaluation, the activation probe still reached 0.849 AUC on the answer-A subset, while TF-IDF reached 0.729. Therefore, the initial result was not entirely an artifact. There was real information about sycophancy in the activations, but 0.849 was a more honest estimate than 0.958.

## Looking through the layers

The original activation probe used the final hidden layer because it was easy to extract using vLLM's pooling interface. There was not a strong theoretical reason to expect it to be the best layer. In fact, the final layer is particularly likely to encode the answer because it is immediately upstream of next-token prediction.

I reran the experiment by extracting mean-pooled residual-stream activations from every second layer and training a separate probe at each depth. I evaluated each layer on the full chains of thought, the truncated chains of thought, and the answer-matched subset.

| layer | full AUC | first 50% | first 25% | answer-matched AUC |
|---|---:|---:|---:|---:|
| 8 | 0.881 | 0.762 | 0.727 | 0.717 |
| 12 | 0.913 | 0.776 | 0.727 | **0.832** |
| 16 | **0.922** | **0.781** | **0.740** | 0.785 |
| 28 | 0.844 | 0.659 | 0.594 | 0.587 |
| 36 | 0.840 | 0.685 | 0.579 | 0.613 |

The middle layers were substantially better under the de-confounding controls. Layer 16 retained an AUC of 0.740 using only the first quarter of the reasoning, compared with 0.600 for the original final-layer representation. Layer 12 performed best on the answer-matched subset.

This is closer to the result I was originally looking for. Before the conclusion is fully visible in the text, the middle-layer activations already contain information that predicts whether the model is going to defer to the user.

There is still an important caveat. None of the layers became independent of the answer: the control-answer AUC remained above 0.70 throughout the network. The middle layers were less dominated by answer information, not free of it.

## Turning the detector into a steering vector

A detector only establishes correlation. Even after the controls, the activation direction could be a consequence of sycophantic reasoning rather than part of the computation that produces it. To test whether the direction was causally relevant, I used it to steer the model.

I constructed a direction at layer 16 by taking the difference between the mean activations for sycophantic and non-sycophantic examples. During generation, I added or subtracted this direction from the residual stream and measured how often the model followed the user's suggestion.

| condition | sycophancy rate on sycophantic pairs | rate on non-sycophantic pairs | control answers stable | parse rate |
|---|---:|---:|---:|---:|
| baseline | 0.534 | 0.658 | 0.882 | 0.993 |
| subtract, alpha = -4 | **0.106** | 0.647 | 0.972 | 0.997 |
| subtract, alpha = -8 | 0.107 | 0.637 | 1.000 | 0.840 |
| add, alpha = +4 | **0.906** | 0.675 | 0.702 | 1.000 |

Subtracting the direction reduced sycophancy from 53.4% to 10.6%, which is roughly a five-fold reduction. Adding the same direction increased it to 90.6%. The effect therefore worked in both directions.

The result I find most important is the behavior on non-sycophantic pairs. These are examples where the model agrees with the user because its own judgment already points in the same direction. Subtracting the vector barely changed this rate: 65.8% at baseline compared with 64.7% at alpha = -4. The intervention suppressed deference without broadly suppressing agreement.

The larger negative intervention did not improve the result and reduced the parse rate to 84%, usually because generations failed to terminate correctly. This is a useful reminder that stronger activation interventions are not necessarily better. Alpha = -4 produced nearly all of the behavioral effect without the same loss in generation quality.

Adding the vector also made control answers less stable. That is a real off-target effect and makes sense: when there is no opinion to follow, pushing the model strongly in an "agree with the user" direction is not a well-defined intervention. I would not describe the direction as a perfectly isolated sycophancy feature.

## What I learned

The first lesson is that a high probe AUC is not, on its own, evidence that a probe has found the concept named by the labels. My original 0.958 result was technically correct, but it supported a much weaker claim than I initially wanted to make. The probe could distinguish the dataset classes, and a large part of how it did so was by decoding the answer.

The second lesson is that controls should be designed around the easiest shortcut available to the classifier. In this case, answer-matched evaluation and control-arm scoring were much more informative than another improvement to the headline AUC. I think both should be standard metrics for this task.

The third lesson is that representation choice matters. The final layer was convenient, but the middle of the network contained a signal that survived much more aggressive removal of answer information. A layer sweep changed the interpretation of the experiment more than changing the classifier did.

Finally, steering gave the strongest evidence that the direction represented something behaviorally meaningful. Subtracting it reduced deference while leaving genuine agreement nearly unchanged, and adding it produced the opposite behavior. That does not prove that layer 16 contains a single clean feature for sycophancy, but it does show that the direction is more than a passive correlate of the final answer.

The short version is that I started with a detector that achieved 0.958 AUC and discovered that much of its performance came from reading the answer key. After controlling for that shortcut, middle-layer probes still detected sycophantic reasoning at around 0.74 to 0.83 AUC. More importantly, the resulting direction could be used to reduce sycophancy from 53% to 11% while leaving the model's independent judgments mostly intact.
