I installed Fedora 44 on an LG Gram 15, model **15Z95N-G.AAE6U1**, expecting at least one obscure laptop component to become a weekend project. Instead, nearly everything worked, including the parts that used to make "Linux on a laptop" sound like a warning.

I paid **$180** for it. The defining feature of the Gram is still there: for a 15-inch laptop, it is absurdly light. It feels closer to carrying a much smaller machine, while still giving me a large screen and a full laptop keyboard. With the power setup described below, I am expecting around **17 hours of battery life** in light use, though I still need a full day away from an outlet to measure that properly.

The machine has an 11th-generation Intel platform with Iris Xe graphics and 16 GB of RAM. I am running Sway rather than a full GNOME desktop. Wi-Fi, Bluetooth, the LG camera, graphics acceleration, brightness controls, suspend, hibernation, and the fingerprint sensor are all working.

The interesting part was not getting Fedora to boot. It was how little work the laptop-specific features required.

## Real deep sleep

The kernel initially selected **s2idle**. This is the newer software-coordinated suspend mode, but on some laptops it draws noticeably more power than traditional ACPI S3 sleep. The firmware on this Gram also exposes **deep** sleep:

    $ cat /sys/power/mem_sleep
    [s2idle] deep

I tested it for one suspend cycle first:

    echo deep | sudo tee /sys/power/mem_sleep
    systemctl suspend

Wake-up worked normally, so I made it the kernel default:

    sudo grubby --update-kernel=ALL --args="mem_sleep_default=deep"

After rebooting, the brackets moved to **deep**:

    $ cat /sys/power/mem_sleep
    s2idle [deep]

Normal suspend now keeps RAM powered but shuts down much more of the platform. Opening the lid restores the exact session in a few seconds, with lower sleep drain than I was seeing under s2idle.

## Hibernation on Btrfs

Fedora uses zram by default. Zram is excellent for normal swapping because it stores compressed pages in RAM, but it cannot hold a hibernation image: once the laptop powers off, the RAM containing both the session and zram is gone.

I added a **20 GiB disk-backed swap file** on the existing Btrfs filesystem. Btrfs swap files need the filesystem's swap-file helper so they are non-compressed, preallocated, and suitable for direct I/O:

    sudo install -d -m 700 /swap
    sudo btrfs filesystem mkswapfile --size 20G /swap/swapfile
    sudo swapon /swap/swapfile

The persistent **/etc/fstab** entry is:

    /swap/swapfile none swap defaults,pri=10 0 0

Resuming from a Btrfs swap file also requires the filesystem UUID and the file's physical resume offset:

    UUID=$(findmnt -no UUID -T /swap/swapfile)
    OFFSET=$(sudo btrfs inspect-internal map-swapfile -r /swap/swapfile)

    sudo grubby --update-kernel=ALL \
      --args="resume=UUID=$UUID resume_offset=$OFFSET"
    sudo dracut --regenerate-all --force

After rebooting, **systemctl hibernate** worked on the first attempt. Fedora wrote the running session to the NVMe drive, powered the laptop fully off, and restored the desktop on the next boot.

I kept Fedora's 8 GiB zram device enabled with a higher priority for everyday memory pressure. The disk swap file mostly sits unused until hibernation needs it.

## Deep sleep first, hibernate later

The nicest setup is **suspend-then-hibernate**. Closing the lid enters deep sleep immediately, so reopening it during the day is fast. If the laptop stays asleep for eight hours, systemd wakes it briefly and hibernates it, preventing days of slow battery drain in a bag.

This is the sleep configuration in **/etc/systemd/sleep.conf.d/60-suspend-then-hibernate.conf**:

    [Sleep]
    AllowSuspendThenHibernate=yes
    HibernateDelaySec=8h
    HibernateOnACPower=yes

And this makes lid-close and the suspend key use that operation:

    [Login]
    SleepOperation=suspend-then-hibernate suspend
    HandleLidSwitch=suspend-then-hibernate
    HandleLidSwitchExternalPower=suspend-then-hibernate
    HandleSuspendKey=suspend-then-hibernate

The transition is coordinated by systemd and the laptop's RTC, or real-time clock. Before entering deep sleep, Linux programs an RTC alarm. Eight hours later the RTC wakes the machine, systemd writes RAM to the swap file, and the laptop powers off into hibernation.

Manual invocation is just:

    systemctl suspend-then-hibernate

## The fingerprint reader works too

The built-in reader identifies as a **Goodix MOC Fingerprint Sensor**, USB ID **27c6:6a94**. Fedora 44 already had libfprint, fprintd, and the PAM module installed, and this particular Goodix device is supported upstream.

Enrollment was one command:

    sudo fprintd-enroll -f right-index-finger palash

The enrolled finger now works at the GDM login screen and for sudo. Fedora's authselect profile had already enabled **with-fingerprint**, so there was no hand-editing of PAM files. Running **sudo whoami** gives me a fingerprint prompt and then prints **root**.

## This is what desktop Linux feels like now

None of this required a custom kernel, an unofficial driver, or a third-party power daemon. Fedora's current kernel supports the Intel platform, libfprint supports the Goodix sensor, systemd connects suspend to hibernation, and dracut builds the resume path into the initramfs.

There was still configuration involved, especially because Fedora's zram default is not enough for hibernation. But the configuration used standard, documented pieces that already shipped with the operating system. More importantly, every feature survived reboot and behaved like part of one coherent system.

On this LG Gram 15Z95N-G.AAE6U1, Fedora 44 is not merely usable. It has working deep sleep, reliable hibernation, automatic suspend-then-hibernate, and fingerprint authentication. For $180, I ended up with a remarkably light 15-inch Linux laptop that I expect to run for roughly 17 hours of light use. That is a better laptop setup than I expected, and it was remarkably easy to get there.
