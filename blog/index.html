<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Palash Taneja</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Fragment+Mono:ital@0;1&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      background: #F0EEE6;
      color: #191919;
      font-family: 'Fraunces', Georgia, serif;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }

    .header {
      margin-bottom: 3.5rem;
    }

    /* Small cream block, matching the homepage buttons */
    .back-link {
      display: inline-block;
      font-family: 'Fragment Mono', monospace;
      color: #3D3929;
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      padding: 0.55rem 1.2rem;
      background: #F1EAD7;
      border: 1.5px solid #3D3929;
      border-radius: 10px;
      box-shadow:
        0 4px 0 0 #CFC7B0,
        0 4px 0 1.5px #3D3929;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .back-link:hover {
      transform: translateY(-2px);
      box-shadow:
        0 6px 0 0 #CFC7B0,
        0 6px 0 1.5px #3D3929;
    }

    .back-link:active {
      transform: translateY(3px);
      box-shadow:
        0 1px 0 0 #CFC7B0,
        0 1px 0 1.5px #3D3929;
    }

    .page-title {
      font-size: 3rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }

    .page-title em {
      font-style: italic;
      font-weight: 400;
      color: #6F7D52;
    }

    .posts-list {
      list-style: none;
    }

    .post-item {
      margin-bottom: 1.75rem;
    }

    /* Post cards as outlined blocks, like the cube's facets */
    .post-link {
      text-decoration: none;
      color: #191919;
      display: block;
      padding: 1.9rem 2.1rem;
      background: #FAF9F5;
      border: 1.5px solid #3D3929;
      border-radius: 14px;
      box-shadow:
        0 5px 0 0 #CFC7B0,
        0 5px 0 1.5px #3D3929;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .post-link:hover {
      transform: translateY(-2px);
      box-shadow:
        0 7px 0 0 #CFC7B0,
        0 7px 0 1.5px #3D3929;
    }

    .post-link:active {
      transform: translateY(4px);
      box-shadow:
        0 1px 0 0 #CFC7B0,
        0 1px 0 1.5px #3D3929;
    }

    .post-link:hover .post-title {
      color: #6F7D52;
    }

    .post-date {
      font-family: 'Fragment Mono', monospace;
      font-size: 0.65rem;
      color: #A39E8F;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.65rem;
    }

    .post-title {
      font-size: 1.35rem;
      font-weight: 500;
      line-height: 1.3;
      transition: color 0.25s ease;
      margin-bottom: 0.65rem;
    }

    .post-excerpt {
      font-size: 0.92rem;
      font-weight: 300;
      color: #6B675C;
      line-height: 1.65;
    }

    .empty-state {
      color: #A39E8F;
      font-size: 0.9rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="../index.html" class="back-link">&larr; Back</a>
      <h1 class="page-title"><em>Blog</em></h1>
    </header>

    <ul class="posts-list" id="posts-list">
      <!-- Posts will be loaded here -->
    </ul>

    <div class="empty-state" id="empty-state" style="display: none;">
      No posts yet. Check back soon!
    </div>
  </div>

  <script>
    // Blog posts registry - add new posts here
    const posts = [
      {
        slug: 'detecting-and-steering-sycophancy-in-qwen',
        title: 'Detecting and Steering Sycophancy in Qwen',
        date: '2026-06-11',
        excerpt: 'A probe that detects sycophantic chain-of-thought at 0.958 AUC, the night of experiments proving most of that was answer leakage, and the layer-16 vector that turns the sycophancy off.'
      },
      {
        slug: 'fedora-on-my-lg-gram',
        title: 'Fedora 44 on My LG Gram: Everything Works',
        date: '2026-06-09',
        excerpt: 'A $180, super-light LG Gram with an expected 17 hours of battery life, plus deep sleep, Btrfs hibernation, and fingerprint authentication.'
      },
      {
        slug: 'training-gpt-2-from-scratch',
        title: 'Training GPT-2 From Scratch on a RunPod',
        date: '2026-04-26',
        excerpt: 'A weekend renting GPUs and writing 400 lines of transformer. Plus two logging bugs that made me think the model was broken.'
      },
      {
        slug: 'looking-for-induction-heads',
        title: 'Looking for Induction Heads',
        date: '2026-04-26',
        excerpt: 'Two weekends staring at attention heatmaps. The first non-trivial circuit you find when you start poking at a transformer.'
      },
      {
        slug: 'hello-world',
        title: 'Hello World',
        date: '2024-01-15',
        excerpt: 'Welcome to my blog. This is my first post where I share a bit about myself and what to expect.'
      }
    ];

    const postsList = document.getElementById('posts-list');
    const emptyState = document.getElementById('empty-state');

    if (posts.length === 0) {
      emptyState.style.display = 'block';
      postsList.style.display = 'none';
    } else {
      posts.sort((a, b) => new Date(b.date) - new Date(a.date));

      posts.forEach(post => {
        const li = document.createElement('li');
        li.className = 'post-item';

        const formattedDate = new Date(post.date).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });

        li.innerHTML = `
          <a href="posts/${post.slug}.html" class="post-link">
            <div class="post-date">${formattedDate}</div>
            <h2 class="post-title">${post.title}</h2>
            <p class="post-excerpt">${post.excerpt}</p>
          </a>
        `;

        postsList.appendChild(li);
      });
    }
  </script>
</body>
</html>
