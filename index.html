<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palash Taneja</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Fragment+Mono:ital@0;1&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #F0EEE6;
      color: #191919;
      font-family: 'Fraunces', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .title {
      position: fixed;
      top: 2rem;
      left: 2.5rem;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: #191919;
    }

    @media (max-width: 767px) {
      .title {
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        white-space: nowrap;
      }
    }

    .info {
      position: fixed;
      bottom: 2rem;
      right: 2.5rem;
      font-style: italic;
      font-weight: 300;
      font-size: 0.8rem;
      text-align: right;
      color: #A39E8F;
      line-height: 1.7;
    }

    .move {
      position: fixed;
      bottom: 2rem;
      left: 2.5rem;
      font-style: italic;
      font-weight: 300;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      color: #A39E8F;
    }

    .bio {
      position: fixed;
      top: 50%;
      right: 12%;
      transform: translateY(-100%);
      max-width: 420px;
      margin-bottom: 2.5rem;
    }

    .bio h1 {
      font-size: 2.6rem;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 1.25rem;
    }

    .bio h1 em {
      font-style: italic;
      font-weight: 400;
      color: #6F7D52;
    }

    .bio p {
      font-size: 1.05rem;
      font-weight: 300;
      line-height: 1.65;
      color: #3D3929;
    }

    .buttons {
      position: fixed;
      top: 50%;
      right: 12%;
      transform: translateY(30%);
      display: flex;
      flex-direction: row;
      gap: 1rem;
    }

    /* Extruded block buttons, echoing the cube's outlined faces */
    .btn {
      display: inline-block;
      padding: 0.85rem 2.1rem;
      font-family: 'Fragment Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-align: center;
      text-decoration: none;
      border: 1.5px solid #3D3929;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .btn-primary {
      background: #6F7D52;
      color: #FAF9F5;
      box-shadow:
        0 5px 0 0 #4F5A3A,
        0 5px 0 1.5px #3D3929;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow:
        0 7px 0 0 #4F5A3A,
        0 7px 0 1.5px #3D3929;
    }

    .btn-primary:active {
      transform: translateY(4px);
      box-shadow:
        0 1px 0 0 #4F5A3A,
        0 1px 0 1.5px #3D3929;
    }

    .btn-secondary {
      background: #F1EAD7;
      color: #3D3929;
      box-shadow:
        0 5px 0 0 #CFC7B0,
        0 5px 0 1.5px #3D3929;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow:
        0 7px 0 0 #CFC7B0,
        0 7px 0 1.5px #3D3929;
    }

    .btn-secondary:active {
      transform: translateY(4px);
      box-shadow:
        0 1px 0 0 #CFC7B0,
        0 1px 0 1.5px #3D3929;
    }

    @media (max-width: 767px) {
      .bio {
        top: auto;
        bottom: 24%;
        right: auto;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        max-width: 320px;
        width: 90%;
      }

      .bio h1 {
        font-size: 1.9rem;
        margin-bottom: 0.85rem;
      }

      .bio p {
        font-size: 0.9rem;
      }

      .buttons {
        top: auto;
        bottom: 11%;
        right: 50%;
        transform: translateX(50%);
        gap: 0.85rem;
      }

      .btn {
        padding: 0.7rem 1.6rem;
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="title">Palash Taneja</div>
  <div class="bio">
    <h1>Hey, I'm <em>Palash</em>.</h1>
    <p>I'm a software engineer based out of Brooklyn, NY.</p>
  </div>
  <div class="buttons">
    <a href="blog/index.html" class="btn btn-primary">Blog</a>
    <a href="public/palash_taneja_resume_2025.pdf" class="btn btn-secondary">Resume</a>
  </div>
  <div class="move" id="move">Move: —</div>
  <div class="info">
    3×3×3 Cube<br>
    Layer Rotation
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const moveEl = document.getElementById('move');

    const INK = '#3D3929';

    // Warm boho palette, one per face
    // [front, back, left, right, bottom, top]
    const faceColors = [
      '#F1EAD7', // cream
      '#DCAE54', // ochre
      '#B25438', // brick
      '#D97757', // terracotta
      '#7E9C99', // dusty teal
      '#9CA878'  // sage
    ];
    const INTERIOR = '#4B4538';

    let width, height;

    // Fixed viewing angle
    const viewRotX = 0.5;
    const viewRotY = -0.6;

    // Move definitions: axis, layer (-1, 0, 1), direction (1 or -1)
    const moves = [
      { name: "R", axis: 'x', layer: 1, dir: 1 },
      { name: "R'", axis: 'x', layer: 1, dir: -1 },
      { name: "L", axis: 'x', layer: -1, dir: -1 },
      { name: "L'", axis: 'x', layer: -1, dir: 1 },
      { name: "U", axis: 'y', layer: 1, dir: 1 },
      { name: "U'", axis: 'y', layer: 1, dir: -1 },
      { name: "D", axis: 'y', layer: -1, dir: -1 },
      { name: "D'", axis: 'y', layer: -1, dir: 1 },
      { name: "F", axis: 'z', layer: -1, dir: 1 },
      { name: "F'", axis: 'z', layer: -1, dir: -1 },
      { name: "B", axis: 'z', layer: 1, dir: -1 },
      { name: "B'", axis: 'z', layer: 1, dir: 1 },
    ];

    // Current animation state
    let currentMove = null;
    let moveAngle = 0;
    let moveQueue = [];
    let pauseTimer = 0;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    resize();
    window.addEventListener('resize', resize);

    // 3D math
    function rotateX(p, a) {
      const cos = Math.cos(a), sin = Math.sin(a);
      return [p[0], p[1] * cos - p[2] * sin, p[1] * sin + p[2] * cos];
    }

    function rotateY(p, a) {
      const cos = Math.cos(a), sin = Math.sin(a);
      return [p[0] * cos + p[2] * sin, p[1], -p[0] * sin + p[2] * cos];
    }

    function rotateZ(p, a) {
      const cos = Math.cos(a), sin = Math.sin(a);
      return [p[0] * cos - p[1] * sin, p[0] * sin + p[1] * cos, p[2]];
    }

    function project(p, scale, offsetX, offsetY) {
      const fov = 120;
      const z = p[2] + 14;
      const factor = fov / z;
      return [
        p[0] * factor * scale + offsetX,
        p[1] * factor * scale + offsetY,
        z
      ];
    }

    // Cubie state - stores position and face colors
    let cubieState = [];

    function initCubies() {
      cubieState = [];
      const gap = 0.08;
      const size = 0.6;

      for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
          for (let z = -1; z <= 1; z++) {
            if (x === 0 && y === 0 && z === 0) continue;

            // Face colors based on original position
            const faceColorIndices = [
              z === -1 ? 0 : -1,  // front (cream)
              z === 1 ? 1 : -1,   // back (ochre)
              x === -1 ? 2 : -1,  // left (brick)
              x === 1 ? 3 : -1,   // right (terracotta)
              y === -1 ? 4 : -1,  // bottom (dusty teal)
              y === 1 ? 5 : -1    // top (sage)
            ];

            cubieState.push({
              pos: [x, y, z],
              faceColors: faceColorIndices,
              size,
              gap
            });
          }
        }
      }
    }

    initCubies();

    function getCubieVerts(cubie) {
      const { pos, size, gap } = cubie;
      const cx = pos[0] * (size + gap);
      const cy = pos[1] * (size + gap);
      const cz = pos[2] * (size + gap);
      const hs = size / 2;

      return [
        [cx - hs, cy - hs, cz - hs],
        [cx + hs, cy - hs, cz - hs],
        [cx + hs, cy + hs, cz - hs],
        [cx - hs, cy + hs, cz - hs],
        [cx - hs, cy - hs, cz + hs],
        [cx + hs, cy - hs, cz + hs],
        [cx + hs, cy + hs, cz + hs],
        [cx - hs, cy + hs, cz + hs]
      ];
    }

    const faceIndices = [
      [0, 1, 2, 3], // front
      [5, 4, 7, 6], // back
      [4, 0, 3, 7], // left
      [1, 5, 6, 2], // right
      [4, 5, 1, 0], // bottom
      [3, 2, 6, 7]  // top
    ];

    function rotateLayer(axis, layer, angle) {
      // Rotate vertices of cubies in the specified layer
      const rotatedCubies = [];

      for (const cubie of cubieState) {
        let verts = getCubieVerts(cubie);
        const axisIdx = axis === 'x' ? 0 : (axis === 'y' ? 1 : 2);

        // Check if this cubie is in the rotating layer
        if (cubie.pos[axisIdx] === layer) {
          // Apply layer rotation to vertices
          verts = verts.map(v => {
            if (axis === 'x') return rotateX(v, angle);
            if (axis === 'y') return rotateY(v, angle);
            return rotateZ(v, angle);
          });
        }

        rotatedCubies.push({
          verts,
          faceColors: cubie.faceColors
        });
      }

      return rotatedCubies;
    }

    function applyMove(move) {
      // Update cubie positions and face colors after a 90° rotation
      const { axis, layer, dir } = move;
      const axisIdx = axis === 'x' ? 0 : (axis === 'y' ? 1 : 2);

      for (const cubie of cubieState) {
        if (cubie.pos[axisIdx] !== layer) continue;

        // Rotate position
        const [x, y, z] = cubie.pos;
        if (axis === 'x') {
          cubie.pos = [x, -z * dir, y * dir];
        } else if (axis === 'y') {
          cubie.pos = [z * dir, y, -x * dir];
        } else {
          cubie.pos = [-y * dir, x * dir, z];
        }

        // Rotate face colors
        const fc = cubie.faceColors;
        if (axis === 'x') {
          // Rotate around X: front<->top<->back<->bottom
          if (dir === 1) {
            cubie.faceColors = [fc[4], fc[5], fc[2], fc[3], fc[1], fc[0]];
          } else {
            cubie.faceColors = [fc[5], fc[4], fc[2], fc[3], fc[0], fc[1]];
          }
        } else if (axis === 'y') {
          // Rotate around Y: front<->left<->back<->right
          if (dir === 1) {
            cubie.faceColors = [fc[3], fc[2], fc[0], fc[1], fc[4], fc[5]];
          } else {
            cubie.faceColors = [fc[2], fc[3], fc[1], fc[0], fc[4], fc[5]];
          }
        } else {
          // Rotate around Z: left<->bottom<->right<->top
          if (dir === 1) {
            cubie.faceColors = [fc[0], fc[1], fc[5], fc[4], fc[2], fc[3]];
          } else {
            cubie.faceColors = [fc[0], fc[1], fc[4], fc[5], fc[3], fc[2]];
          }
        }
      }
    }

    function queueRandomMove() {
      const move = moves[Math.floor(Math.random() * moves.length)];
      moveQueue.push(move);
    }

    function getFaceInfo(verts, indices) {
      const v0 = verts[indices[0]];
      const v1 = verts[indices[1]];
      const v2 = verts[indices[2]];

      const ax = v1[0] - v0[0], ay = v1[1] - v0[1], az = v1[2] - v0[2];
      const bx = v2[0] - v0[0], by = v2[1] - v0[1], bz = v2[2] - v0[2];

      const nx = ay * bz - az * by;
      const ny = az * bx - ax * bz;
      const nz = ax * by - ay * bx;

      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      // The face winding yields an inward normal; negate to get outward
      const normal = [-nx / len, -ny / len, -nz / len];

      // Soft key light from the upper left
      const light = [-0.6, -0.55, -0.58];

      const dot = normal[0] * light[0] + normal[1] * light[1] + normal[2] * light[2];

      const centerZ = (v0[2] + v1[2] + verts[indices[2]][2] + verts[indices[3]][2]) / 4;

      // Gentle continuous shading rather than harsh two-tone
      const shade = 0.82 + 0.18 * dot;
      return { normal, shade, centerZ };
    }

    function hexToRgb(hex) {
      return [
        parseInt(hex.slice(1, 3), 16),
        parseInt(hex.slice(3, 5), 16),
        parseInt(hex.slice(5, 7), 16)
      ];
    }

    function shadeColor(hex, shade) {
      const [r, g, b] = hexToRgb(hex);
      return `rgb(${Math.round(r * shade)}, ${Math.round(g * shade)}, ${Math.round(b * shade)})`;
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      // Handle move animation
      if (pauseTimer > 0) {
        pauseTimer--;
      } else if (currentMove) {
        moveAngle += 0.08 * currentMove.dir;
        const targetAngle = (Math.PI / 2) * currentMove.dir;

        if (Math.abs(moveAngle) >= Math.abs(targetAngle)) {
          applyMove(currentMove);
          currentMove = null;
          moveAngle = 0;
          pauseTimer = 30; // Brief pause between moves
          moveEl.textContent = 'Move: —';
        }
      } else if (moveQueue.length > 0) {
        currentMove = moveQueue.shift();
        moveEl.textContent = `Move: ${currentMove.name}`;
      } else {
        queueRandomMove();
      }

      // Get cubies with layer rotation applied
      let rotatedCubies;
      if (currentMove) {
        rotatedCubies = rotateLayer(currentMove.axis, currentMove.layer, moveAngle);
      } else {
        rotatedCubies = cubieState.map(c => ({
          verts: getCubieVerts(c),
          faceColors: c.faceColors
        }));
      }

      const scale = Math.min(width, height) * 0.022;

      // Position: left side on desktop, top center (below title) on mobile
      const isMobile = window.innerWidth < 768;
      const cubeX = isMobile ? width / 2 : width * 0.25;
      const cubeY = isMobile ? height * 0.4 : height / 2;

      const allFaces = [];

      for (const cubie of rotatedCubies) {
        // Apply view rotation
        const transformed = cubie.verts.map(v => {
          let p = rotateX(v, viewRotX);
          p = rotateY(p, viewRotY);
          return p;
        });

        const projected = transformed.map(v => project(v, scale, cubeX, cubeY));

        for (let i = 0; i < 6; i++) {
          const info = getFaceInfo(transformed, faceIndices[i]);
          if (info.normal[2] >= 0) continue;

          allFaces.push({
            projected,
            indices: faceIndices[i],
            colorIdx: cubie.faceColors[i],
            shade: info.shade,
            centerZ: info.centerZ
          });
        }
      }

      allFaces.sort((a, b) => b.centerZ - a.centerZ);

      ctx.lineJoin = 'round';
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = INK;

      for (const face of allFaces) {
        const pts = face.indices.map(i => face.projected[i]);

        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.closePath();

        const base = face.colorIdx === -1 ? INTERIOR : faceColors[face.colorIdx];
        ctx.fillStyle = shadeColor(base, face.shade);
        ctx.fill();
        ctx.stroke();
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
